name: Run tests with coverage (Scala code)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate_commit:
    name: Validate commit
    runs-on: ubuntu-latest-16-cores-public

    if: ${{ github.ref != 'refs/heads/main' && ((github.event.pull_request.stack != null && github.event.pull_request.stack.position == github.event.pull_request.stack.size) || (github.event.pull_request.stack == null)) }}
    permissions:
      id-token: write      # required for dependabot PRs
      pull-requests: write # required for dependabot PRs
      contents: read       # required for dependabot PRs
      code-quality: write

      checks: write       # required for cobertura-action
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Scala
        uses: japgolly/setup-everything-scala@v4.1
        with:
          java-version: temurin:1.25.0.2

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build the Docker Compose stack
        run: just up --quiet-pull

      - name: Get Compose Logs
        if: always()
        run: just logs

      - name: Build and test
        run: just test "clean; coverage; test; coverageReport"

      - name: Validate formatting
        run: just fmt-check

      - uses: actions/upload-code-coverage@v1
        with:
          fail-on-error: false
          file: target/out/jvm/scala-3.9.0/arcane-framework/coverage-report/cobertura.xml
          language: Java
          label: code-coverage/jacoco
